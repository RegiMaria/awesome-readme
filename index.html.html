<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Badges Neon</title>
<style>
  :root {
    --bg: #0b0712;
    --card-bg: #150d22;
    --card-bg-2: #1b1130;
    --border: #2b1c47;
    --text: #f3effa;
    --muted: #9a8fb0;
    --accent-1: #ff2ea6;
    --accent-2: #8a2be2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(255,46,166,0.14), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(138,43,226,0.16), transparent 45%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 80px;
  }
  .eyebrow {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.3px;
    margin-bottom: 6px;
  }
  h1 {
    font-size: 30px;
    margin: 0 0 32px;
    font-weight: 800;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
    width: 100%;
    max-width: 900px;
  }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 26px;
  }
  .panel h2 {
    font-size: 14px;
    text-transform: none;
    color: var(--muted);
    margin: 0 0 18px;
    font-weight: 600;
  }
  .preview-stage {
    background: #060309;
    border-radius: 14px;
    padding: 50px 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 22px;
    min-height: 100px;
  }
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 7px;
  }
  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 11px 13px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: #0e0817;
    color: #fff;
    font-size: 14.5px;
    outline: none;
    transition: border 0.15s;
  }
  input[type="text"]:focus, input[type="number"]:focus { border-color: var(--accent-1); }

  .emoji-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
  }
  .emoji-btn {
    aspect-ratio: 1;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: #0e0817;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border 0.15s, transform 0.1s;
  }
  .emoji-btn:hover { transform: scale(1.08); }
  .emoji-btn.selected { border-color: var(--accent-1); background: #241333; }

  .swatches { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .swatch {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.1s, border 0.15s;
  }
  .swatch:hover { transform: scale(1.08); }
  .swatch.selected { border-color: #fff; }

  .color-row { display: flex; gap: 12px; }
  .color-row .field { flex: 1; margin-bottom: 0; }
  input[type="color"] {
    width: 100%;
    height: 42px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: #0e0817;
    cursor: pointer;
    padding: 3px;
  }

  .actions { display: flex; gap: 10px; margin-top: 4px; }
  button {
    flex: 1;
    padding: 12px 16px;
    border-radius: 9px;
    border: none;
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.12s, opacity 0.2s;
  }
  button:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    color: #fff;
  }
  .btn-secondary {
    background: #241333;
    color: #fff;
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: #2d1848; }

  textarea {
    width: 100%;
    margin-top: 18px;
    height: 130px;
    background: #090510;
    border: 1px solid var(--border);
    border-radius: 9px;
    color: #a99bd6;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px;
    padding: 12px;
    resize: vertical;
  }

  .toast {
    position: fixed;
    bottom: 26px;
    background: #10b981;
    color: #fff;
    padding: 11px 22px;
    border-radius: 9px;
    font-weight: 600;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

  <div class="eyebrow">badges neon para README</div>
  <h1>Gerador de Badges</h1>

  <div class="layout">

    <div class="panel">
      <h2>Preview</h2>
      <div class="preview-stage" id="previewBox"></div>

      <div class="field">
        <label for="titleInput">Texto do badge</label>
        <input type="text" id="titleInput" value="MEU PROJETO EM DESTAQUE">
      </div>

      <div class="field">
        <label>Ícone</label>
        <div class="emoji-grid" id="emojiGrid"></div>
        <div class="field" style="margin-top:10px;">
          <input type="text" id="customEmojiInput" placeholder="ou cole seu próprio emoji aqui" maxlength="4">
        </div>
      </div>

      <div class="field">
        <label for="speedInput">Velocidade da pulsação (segundos)</label>
        <input type="number" id="speedInput" value="2.4" step="0.2" min="0.8" max="6">
      </div>
    </div>

    <div class="panel">
      <h2>Cores</h2>

      <div class="field">
        <label>Combinações prontas</label>
        <div class="swatches" id="presetSwatches"></div>
      </div>

      <div class="color-row">
        <div class="field">
          <label for="color1Input">Cor 1</label>
          <input type="color" id="color1Input" value="#ff2ea6">
        </div>
        <div class="field">
          <label for="color2Input">Cor 2</label>
          <input type="color" id="color2Input" value="#8a2be2">
        </div>
      </div>

      <div class="actions" style="margin-top: 22px;">
        <button class="btn-primary" id="downloadBtn">⬇ Baixar badge.svg</button>
        <button class="btn-secondary" id="copyBtn">Copiar código</button>
      </div>

      <textarea id="svgCodeOutput" readonly></textarea>
    </div>

  </div>

  <div class="toast" id="toast">Copiado para a área de transferência!</div>

<script>
  const CUTE_EMOJIS = ['🌸','🐣','🦄','✨','💫','🍬','🎀','🧁','🍡','🐥','🌈','💖','🍭','🐰','🧸','🐢'];

  const PRESETS = [
    { name: 'Rosa & Roxo', c1: '#ff2ea6', c2: '#8a2be2' },
    { name: 'Céu & Lavanda', c1: '#5bc8ff', c2: '#a78bfa' },
    { name: 'Pôr do sol', c1: '#ff7a59', c2: '#ffd166' },
    { name: 'Menta', c1: '#34e2b0', c2: '#3ab7ff' },
    { name: 'Vermelho & Ouro', c1: '#ff3d5a', c2: '#ffcf5c' },
    { name: 'Coral & Rosa', c1: '#ff6fa5', c2: '#ffb199' },
  ];

  const titleInput = document.getElementById('titleInput');
  const speedInput = document.getElementById('speedInput');
  const customEmojiInput = document.getElementById('customEmojiInput');
  const color1Input = document.getElementById('color1Input');
  const color2Input = document.getElementById('color2Input');
  const previewBox = document.getElementById('previewBox');
  const svgCodeOutput = document.getElementById('svgCodeOutput');
  const emojiGrid = document.getElementById('emojiGrid');
  const presetSwatches = document.getElementById('presetSwatches');
  const toast = document.getElementById('toast');

  let selectedEmoji = '🌸';

  CUTE_EMOJIS.forEach((emoji, i) => {
    const btn = document.createElement('button');
    btn.className = 'emoji-btn' + (i === 0 ? ' selected' : '');
    btn.textContent = emoji;
    btn.type = 'button';
    btn.addEventListener('click', () => {
      selectedEmoji = emoji;
      customEmojiInput.value = '';
      document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      update();
    });
    emojiGrid.appendChild(btn);
  });

  PRESETS.forEach((preset, i) => {
    const sw = document.createElement('div');
    sw.className = 'swatch' + (i === 0 ? ' selected' : '');
    sw.style.background = `linear-gradient(135deg, ${preset.c1}, ${preset.c2})`;
    sw.title = preset.name;
    sw.addEventListener('click', () => {
      color1Input.value = preset.c1;
      color2Input.value = preset.c2;
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
      sw.classList.add('selected');
      update();
    });
    presetSwatches.appendChild(sw);
  });

  customEmojiInput.addEventListener('input', () => {
    if (customEmojiInput.value.trim()) {
      selectedEmoji = customEmojiInput.value.trim();
      document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
      update();
    }
  });

  function calculateFontSize(text) {
    const len = text.length;
    if (len <= 16) return 13;
    if (len <= 22) return 11.5;
    if (len <= 28) return 10;
    return 9;
  }

  function generateSVG(emoji, title, speed, c1, c2) {
    const fontSize = calculateFontSize(title);
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 62" width="260" height="62">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="${c1}" />
      <stop offset="100%" stop-color="${c2}" />
    </linearGradient>

    <linearGradient id="iconCircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="${c1}" stop-opacity="0.3" />
      <stop offset="100%" stop-color="${c2}" stop-opacity="0.15" />
    </linearGradient>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="${c1}">
        <animate attributeName="stdDeviation" values="2;5;2" dur="${speed}s" repeatCount="indefinite" />
        <animate attributeName="flood-opacity" values="0.45;0.95;0.45" dur="${speed}s" repeatCount="indefinite" />
      </feDropShadow>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="${c2}">
        <animate attributeName="stdDeviation" values="4;8;4" dur="${speed}s" repeatCount="indefinite" />
        <animate attributeName="flood-opacity" values="0.3;0.8;0.3" dur="${speed}s" repeatCount="indefinite" />
      </feDropShadow>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="${c1}">
        <animate attributeName="stdDeviation" values="1;2.5;1" dur="${speed}s" repeatCount="indefinite" />
        <animate attributeName="flood-opacity" values="0.5;0.95;0.5" dur="${speed}s" repeatCount="indefinite" />
      </feDropShadow>
    </filter>
  </defs>

  <style>
    .badge-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
  </style>

  <rect x="2" y="2" width="256" height="58" rx="29" fill="#0d0611" />

  <rect x="2" y="2" width="256" height="58" rx="29"
        fill="none"
        stroke="url(#neonGrad)"
        stroke-width="2"
        filter="url(#neonGlow)">
    <animate attributeName="stroke-opacity" values="0.75;1;0.75" dur="${speed}s" repeatCount="indefinite" />
  </rect>

  <g transform="translate(31, 31)">
    <circle r="19" fill="url(#iconCircleGrad)" />
    <circle r="19" fill="none" stroke="url(#neonGrad)" stroke-width="1.5" filter="url(#neonGlow)">
      <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="${speed}s" repeatCount="indefinite" />
    </circle>
    <text text-anchor="middle" dominant-baseline="central" font-size="18" y="1">${emoji}</text>
  </g>

  <text class="badge-title"
        x="62"
        y="36"
        font-size="${fontSize}px"
        fill="url(#neonGrad)"
        filter="url(#textGlow)">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="${speed}s" repeatCount="indefinite" />
    ${title}
  </text>
</svg>`;
  }

  function update() {
    const title = titleInput.value || 'MEU BADGE';
    const speed = parseFloat(speedInput.value) || 2.4;
    const c1 = color1Input.value;
    const c2 = color2Input.value;
    const code = generateSVG(selectedEmoji, title, speed, c1, c2);
    previewBox.innerHTML = code;
    svgCodeOutput.value = code;
  }

  [titleInput, speedInput, color1Input, color2Input].forEach(el => {
    el.addEventListener('input', update);
  });

  document.getElementById('copyBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(svgCodeOutput.value).then(() => {
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    });
  });

  document.getElementById('downloadBtn').addEventListener('click', () => {
    const blob = new Blob([svgCodeOutput.value], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'badge.svg';
    a.click();
    URL.revokeObjectURL(url);
  });

  update();
</script>
</body>
</html>
